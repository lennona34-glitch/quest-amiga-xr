<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Amiga PUAE Engine (AGA & CD32)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    #game {
      aspect-ratio: 4 / 3;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #game.c128-vdc-80 {
      aspect-ratio: 4 / 3 !important;
    }
    /* Easy CRT Screen Filter (Aperture Grille, Scanlines, Phosphor Glow & Vignette) */
    #game.crt-active {
      position: relative;
    }
    #game.crt-active::after {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
      background: 
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.28) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.035), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.035));
      background-size: 100% 3px, 3px 100%;
    }
    #game.crt-active::before {
      content: " ";
      display: block;
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 16;
      background: radial-gradient(circle at center, transparent 72%, rgba(0, 0, 0, 0.4) 100%);
      box-shadow: inset 0 0 35px rgba(0, 0, 0, 0.55);
    }
    #game.crt-active canvas,
    #game.crt-active .ejs_canvas {
      filter: contrast(1.08) brightness(1.06) saturate(1.1);
    }
    @media (max-aspect-ratio: 4/3) {
      #game {
        width: 100%;
        height: auto;
      }
    }
    .ejs_canvas_parent,
    #game .ejs_parent {
      width: 100% !important;
      height: 100% !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #game canvas,
    #game .ejs_canvas,
    .ejs_canvas_parent canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
    }
    .ejs_menu_bar,
    .ejs_bottom_bar,
    .ejs_menu,
    .ejs_quick_menu,
    .ejs_settings_menu,
    .ejs_menu_toggle,
    .ejs_virtualGamepad_open {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .c128-toggle-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 20px;
      padding: 3px 6px;
      z-index: 20;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 4px;
      user-select: none;
    }
    .c128-pill {
      background: transparent;
      border: none;
      outline: none;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .c128-pill:hover {
      color: #f8fafc;
    }
    .c128-pill-vicii.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.7);
    }
    .c128-pill-vdc.active {
      background: #10b981;
      color: #052e16;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
    }
    .c128-shortcut {
      font-size: 10px;
      color: #64748b;
      padding: 0 4px;
      font-family: monospace;
    }
    #loading_overlay {
      position: absolute;
      inset: 0;
      background: #080a10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s ease;
      gap: 16px;
    }
    .puae-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #1e293b;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .puae-title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #38bdf8;
      text-transform: uppercase;
    }
    .puae-subtitle {
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="loading_overlay">
      <div class="puae-spinner"></div>
      <div class="puae-title">PUAE Core Initializing</div>
      <div class="puae-subtitle" id="puae_status">Loading AGA & CD32 Hardware Engine...</div>
    </div>
    <div id="game"></div>
  </div>

  <script>
    // Parse URL hash for configuration
    let config = {};
    try {
      if (window.location.hash.length > 1) {
        config = JSON.parse(decodeURIComponent(window.location.hash.substring(1)));
      }
    } catch (e) {
      console.warn('[PUAE] Config parse error:', e);
    }

    const crtPref = (config.crt !== undefined) ? !!config.crt : (localStorage.getItem('crt_filter_enabled') === 'true');
    const initialGameEl = document.getElementById('game');
    if (initialGameEl) {
      initialGameEl.classList.toggle('crt-active', crtPref);
    }

    const activeCore = config.core || 'amiga';
    const coreNames = {
      c64: 'Commodore 64',
      c128: 'Commodore 128',
      plus4: 'Commodore Plus/4',
      vic20: 'Commodore VIC-20',
      amiga: 'Commodore Amiga'
    };

    let defaultGameUrl = config.gameUrl;
    const reqModel = config.model || '';
    const tempUrlLower = (defaultGameUrl || '').toLowerCase();
    const isCd32 = activeCore === 'cd32' ||
                   reqModel === 'CD32' ||
                   tempUrlLower.includes('cd32') ||
                   tempUrlLower.includes('.iso') ||
                   tempUrlLower.includes('.cue') ||
                   tempUrlLower.includes('.chd') ||
                   tempUrlLower.includes('.nrg') ||
                   (config.title && config.title.toLowerCase().includes('cd32'));

    let isGuardianSplash = true;
    try {
      if (config.splashMode !== undefined) {
        isGuardianSplash = (config.splashMode === 'guardian' || config.splashMode === true);
      } else if (localStorage.getItem('guardian_splash') !== null) {
        isGuardianSplash = localStorage.getItem('guardian_splash') !== 'bios';
      }
    } catch(e) {}

    if (!defaultGameUrl || defaultGameUrl.trim() === '') {
      if (isGuardianSplash) {
        if (activeCore === 'c64') defaultGameUrl = '/disks/c64_guardian.prg';
        else if (activeCore === 'c128') defaultGameUrl = '/disks/c128_guardian.prg';
        else if (activeCore === 'plus4') defaultGameUrl = '/disks/plus4_guardian.prg';
        else if (activeCore === 'vic20') defaultGameUrl = '/disks/c64_guardian.prg';
        else if (isCd32) defaultGameUrl = '';
        else defaultGameUrl = '/disks/blank.adf';
      } else {
        if (activeCore === 'c64') defaultGameUrl = '/disks/c64_blank.d64';
        else if (activeCore === 'c128') defaultGameUrl = '/disks/c128_blank.d64';
        else if (activeCore === 'plus4') defaultGameUrl = '/disks/plus4_blank.d64';
        else if (activeCore === 'vic20') defaultGameUrl = '/disks/c64_blank.d64';
        else if (isCd32) defaultGameUrl = '';
        else defaultGameUrl = '/disks/blank.adf';
      }
    }

    const gameUrlLower = (defaultGameUrl || '').toLowerCase();
    const isAga = !isCd32 && (
      reqModel === 'A1200' ||
      activeCore === 'aga' ||
      gameUrlLower.includes('(aga)') ||
      gameUrlLower.includes('[aga]') ||
      /\baga\b/i.test(gameUrlLower) ||
      (config.title && (config.title.toLowerCase().includes('(aga)') || config.title.toLowerCase().includes('[aga]') || /\baga\b/i.test(config.title)))
    );

    let puaeModel = 'A500';
    if (isCd32) {
      puaeModel = 'CD32';
    } else if (reqModel === 'A500') {
      puaeModel = 'A500';
    } else if (reqModel === 'A1200' || isAga) {
      puaeModel = 'A1200';
    } else if (reqModel) {
      puaeModel = reqModel;
    }

    window.puae_frames = 0;
    const origRAF = window.requestAnimationFrame;
    window.requestAnimationFrame = function(cb) {
      window.puae_frames++;
      return origRAF(cb);
    };


    if (isCd32) {
      document.title = 'Commodore Amiga CD32 - Commodore Guardian';
    } else if (puaeModel === 'A1200') {
      document.title = 'Commodore Amiga 1200 AGA - Commodore Guardian';
    } else {
      document.title = `${coreNames[activeCore] || 'Commodore'} - Commodore Guardian`;
    }

    const titleEl = document.querySelector('.puae-title');
    const statusEl = document.getElementById('puae_status');
    const overlay = document.getElementById('loading_overlay');

    if (titleEl) {
      if (isCd32) titleEl.textContent = 'Commodore Amiga CD32 Initializing';
      else if (puaeModel === 'A1200') titleEl.textContent = 'Commodore Amiga 1200 (AGA) Initializing';
      else if (activeCore === 'c64') titleEl.textContent = 'Commodore 64 Initializing';
      else if (activeCore === 'c128') titleEl.textContent = 'Commodore 128 Initializing';
      else if (activeCore === 'plus4') titleEl.textContent = 'Commodore Plus/4 Initializing';
      else if (activeCore === 'vic20') titleEl.textContent = 'Commodore VIC-20 Initializing';
      else titleEl.textContent = 'Commodore Amiga (PUAE) Initializing';
    }
    if (statusEl) {
      if (isCd32) statusEl.textContent = 'Loading CD32 Akiko CD-ROM Controller & AGA Engine...';
      else if (puaeModel === 'A1200') statusEl.textContent = 'Loading Motorola 68020 32-Bit & AGA Lisa Engine...';
      else if (activeCore === 'c64') statusEl.textContent = 'Loading MOS 6510, SID 6581 & VIC-II (VICE x64sc)...';
      else if (activeCore === 'c128') statusEl.textContent = 'Loading Dual-CPU 8502/Z80 & VDC 80-Col (VICE x128)...';
      else if (activeCore === 'plus4') statusEl.textContent = 'Loading MOS 7501 & TED 7360 121-Color (VICE xplus4)...';
      else if (activeCore === 'vic20') statusEl.textContent = 'Loading VIC-20 6502 & VIC 6560 (VICE xvic)...';
      else statusEl.textContent = 'Loading AGA & CD32 Hardware Engine...';
    }

    // Track and hook all WebAudio AudioContext instances (VICE + PUAE)
    window.__allAudioContexts = [];
    const OrigAudioContext = window.AudioContext || window.webkitAudioContext;
    if (OrigAudioContext) {
      const TrackedAudioContext = class extends OrigAudioContext {
        constructor(options) {
          const opts = Object.assign({ latencyHint: 'balanced' }, options);
          if (opts.latencyHint === 'interactive') {
            opts.latencyHint = 'balanced';
          }
          super(opts);
          window.__allAudioContexts.push(this);
          console.log('[AUDIO TRACKER] AudioContext created, sampleRate:', this.sampleRate, 'state:', this.state, 'latencyHint:', opts.latencyHint);
        }
      };
      window.AudioContext = TrackedAudioContext;
      window.webkitAudioContext = TrackedAudioContext;
    }

    // Read warp boot preference (defaults to enabled for instant fast boot)
    let isWarpBoot = true;
    try {
      if (config.warpBoot !== undefined) {
        isWarpBoot = !!config.warpBoot;
      } else if (localStorage.getItem('c64_warp_boot') !== null) {
        isWarpBoot = localStorage.getItem('c64_warp_boot') !== 'false';
      }
    } catch(e) {}

    // Hi-Fi Core Options (Smooth 50/60fps playback without audio buffer underruns):
    // Only enable vice_autoloadwarp if there is actual game media mounted, avoiding ?FILE NOT FOUND ERROR on clean machine boot
    const hasMedia = !!defaultGameUrl && defaultGameUrl !== '' && !defaultGameUrl.includes('guardian.prg') && !defaultGameUrl.includes('blank.');
    const is80Col = gameUrlLower.includes('80 col') ||
                   gameUrlLower.includes('80col') ||
                   gameUrlLower.includes('80-col') ||
                   gameUrlLower.includes('80_col') ||
                   gameUrlLower.includes('[80') ||
                   gameUrlLower.includes('(80') ||
                   gameUrlLower.includes(' 80 ') ||
                   gameUrlLower.includes(' 80.') ||
                   gameUrlLower.includes('vdc') ||
                   gameUrlLower.includes('c128_guardian') ||
                   gameUrlLower.includes('c128_blank') ||
                   gameUrlLower.includes('infocom') ||
                   gameUrlLower.includes('voyag') ||
                   gameUrlLower.includes('trinity') ||
                   gameUrlLower.includes('bureaucracy') ||
                   gameUrlLower.includes('zork') ||
                   gameUrlLower.includes('spiceware') ||
                   gameUrlLower.includes('invaders') ||
                   gameUrlLower.includes('uniquest') ||
                   gameUrlLower.includes('millifoot') ||
                   gameUrlLower.includes('solitair') ||
                   gameUrlLower.includes('chess 128') ||
                   (config.title && (
                     config.title.toLowerCase().includes('80 col') ||
                     config.title.toLowerCase().includes('80col') ||
                     config.title.toLowerCase().includes('80-col') ||
                     config.title.toLowerCase().includes('[80') ||
                     config.title.toLowerCase().includes('(80') ||
                     config.title.toLowerCase().includes(' 80 ') ||
                     config.title.toLowerCase().includes('vdc') ||
                     config.title.toLowerCase().includes('guardian') ||
                     config.title.toLowerCase().includes('infocom') ||
                     config.title.toLowerCase().includes('voyag') ||
                     config.title.toLowerCase().includes('trinity') ||
                     config.title.toLowerCase().includes('bureaucracy') ||
                     config.title.toLowerCase().includes('zork') ||
                     config.title.toLowerCase().includes('spiceware') ||
                     config.title.toLowerCase().includes('invaders') ||
                     config.title.toLowerCase().includes('uniquest') ||
                     config.title.toLowerCase().includes('millifoot') ||
                     config.title.toLowerCase().includes('solitair') ||
                     config.title.toLowerCase().includes('chess 128')
                   ));

    if (activeCore === 'c64' || activeCore === 'plus4' || activeCore === 'vic20') {
      window.EJS_defaultOptions = {
        vice_aspect_ratio: "auto",
        vice_crop: "auto",
        vice_crop_mode: "4:3",
        vice_autostart: "warp",
        vice_autoloadwarp: (hasMedia && isWarpBoot) ? "enabled" : "disabled",
        vice_warp_boost: "enabled",
        vice_sound_sample_rate: "48000",
        vice_sid_model: "6581",
        vice_sid_engine: "ReSID",
        vice_resid_sampling: "resampling",
        vice_resid_passband: "90",
        vice_resid_gain: "100",
        vice_joyport: "2",
        vice_physical_keyboard_pass_through: "enabled",
        vice_keyboard_keymap: "symbolic",
        vice_drive_true_emulation: "disabled",
        vice_virtual_device_traps: "enabled"
      };
    } else {
      window.EJS_defaultOptions = {
        puae_sound_filter: "auto",
        puae_sound_filter_type: "enhanced",
        puae_sound_interpol: "anti",
        puae_sound_stereo_separation: "80%",
        puae_model: puaeModel,
        puae_model_cd: "CD32",
        puae_model_fd: isCd32 ? "A500" : (puaeModel === "A1200" ? "A1200" : "A500"),
        puae_chipmem_size: (puaeModel === "A1200") ? "4" : "auto",
        puae_fastmem_size: (puaeModel === "A1200") ? "8" : "0",
        puae_z3mem_size: (puaeModel === "A1200") ? "64" : "0",
        puae_bogomem_size: "0",
        puae_kickstart: "auto",
        puae_floppy_multidrive: isCd32 ? "disabled" : "enabled",
        puae_floppy_speed: "100",
        puae_autoloadfastforward: isCd32 ? "disabled" : "fd",
        puae_joyport: "joystick",
        puae_joyport_order: "1234",
        puae_analogmouse: "disabled",
        puae_cd_startup_delayed_insert: "disabled",
        puae_cd32pad_options: "disabled",
        puae_cd_speed: "0",
        puae_sound_volume_cd: "100",
        puae_cpu_multiplier: "0",
        puae_immediate_blits: "false",
        puae_video_options_display: "disabled",
        puae_video_aspect: "auto",
        puae_video_resolution: "auto",
        puae_video_vresolution: "auto",
        puae_crop: "auto",
        puae_crop_mode: "both",
        puae_zoom_mode: "auto",
        puae_video_standard: "PAL"
      };
    }

    if (config.options && window.EJS_defaultOptions) {
      Object.assign(window.EJS_defaultOptions, config.options);
    }

    const isCrtActive = (config.crt !== undefined) ? !!config.crt : (localStorage.getItem('crt_filter_enabled') === 'true');
    const targetShader = "disabled";

    try {
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        const item = localStorage.getItem(k);
        if (item && (item.includes('shader') || item.includes('settings'))) {
          try {
            const parsed = JSON.parse(item);
            if (parsed && parsed.settings && parsed.settings.shader !== undefined) {
              parsed.settings.shader = targetShader;
              localStorage.setItem(k, JSON.stringify(parsed));
            }
          } catch(e) {}
        }
      }
    } catch(e) {}

    window.EJS_defaultShader = targetShader;
    window.EJS_shader = targetShader;
    window.EJS_volume = 1.0;
    window.EJS_DEBUG_XX = true;
    window.EJS_model = puaeModel;
    window.EJS_player = '#game';
    window.EJS_core = (activeCore === 'cd32') ? 'amiga' : activeCore;
    window.EJS_gameUrl = defaultGameUrl;
    window.EJS_pathtodata = '/emulatorjs/';
    // CD32 needs the threaded core (patched glue: pthread entry called via wasmTable). Opt out: localStorage.setItem('puae_threads','0')
    let wantThreads = true; try { wantThreads = localStorage.getItem('puae_threads') !== '0'; } catch(e) {}
    window.EJS_threads = !!(wantThreads && isCd32 && window.crossOriginIsolated && typeof SharedArrayBuffer === 'function');
    console.log('[PUAE] EJS_threads =', window.EJS_threads, 'crossOriginIsolated =', window.crossOriginIsolated);
    window.EJS_webgl2 = true;
    window.EJS_disableCue = false;
    window.EJS_disableDatabases = true;
    window.EJS_hideSettings = true;
    window.EJS_noAutoFocus = true;
    window.EJS_CacheLimit = 0;
    window.EJS_defaultControls = {
      0: { 24: {}, 25: {}, 26: {} },
      1: {},
      2: {},
      3: {}
    };

    window.EJS_biosUrl = '';
    if (activeCore === 'amiga' || activeCore === 'cd32' || activeCore === 'aga') {
      // Direct raw Kickstarts mounted for the specific active Commodore model:
      window.EJS_externalFiles = {};
      const mountRom = (targetBase, src) => {
        const prefixes = [
          "/home/web_user/retroarch/userdata/system/",
          "/home/web_user/retroarch/system/",
          "/system/",
          "/system/uae/",
          "/"
        ];
        for (const p of prefixes) {
          window.EJS_externalFiles[p + targetBase] = src;
          window.EJS_externalFiles[p + targetBase.toLowerCase()] = src;
        }
      };

      // CD32
      mountRom("kick40060.CD32", "/roms/kick40060.CD32");
      mountRom("kick40060.CD32.ext", "/roms/kick40060.CD32.ext");
      mountRom("cd32.rom", "/roms/kick40060.CD32");
      mountRom("cd32_ext.rom", "/roms/kick40060.CD32.ext");
      mountRom("amiga-os-310-cd32.rom", "/roms/kick40060.CD32");
      mountRom("amiga-os-310-cd32-ext.rom", "/roms/kick40060.CD32.ext");

      // A1200 AGA
      mountRom("kick40068.A1200", "/roms/kick40068.A1200");
      mountRom("kick31.rom", "/roms/kick40068.A1200");
      mountRom("amiga-os-310-a1200.rom", "/roms/kick40068.A1200");

      // A500 OCS/ECS
      mountRom("kick34005.A500", "/roms/kick34005.A500");
      mountRom("kick37175.A500", "/roms/kick37175.A500");
      mountRom("kick13.rom", "/roms/kick34005.A500");
      mountRom("kick204.rom", "/roms/kick37175.A500");
      mountRom("amiga-os-130.rom", "/roms/kick34005.A500");
      window.EJS_color = '#0055aa';
    } else if (activeCore === 'c64') {
      window.EJS_color = '#4040a0';
    } else if (activeCore === 'plus4') {
      window.EJS_color = '#732c1c';
    } else if (activeCore === 'vic20') {
      window.EJS_color = '#00aaaa';
    }
    window.EJS_startOnLoaded = true;
    window.EJS_align = 'center';

    function dismissOverlay() {
      if (overlay && overlay.style.display !== 'none') {
        overlay.style.opacity = '0';
        setTimeout(() => { overlay.style.display = 'none'; }, 400);
      }
      const loadingEl = document.querySelector('.ejs_loading_text');
      if (loadingEl) {
        loadingEl.style.display = 'none';
      }
      window.parent.postMessage({ msg: 'render_run_state', value: true }, '*');
    }

    window.EJS_onGameStart = function() {
      console.log('[PUAE] Game started successfully (onGameStart)');
      dismissOverlay();
    };

    window.EJS_ready = function() {
      console.log('[PUAE] EmulatorJS ready hook');
      if (window.EJS_emulator) {
        window.EJS_emulator.on('start', () => {
          console.log('[PUAE] EmulatorJS start event triggered');
          dismissOverlay();
          setTimeout(() => {
            try {
              const gm = window.EJS_emulator && window.EJS_emulator.gameManager;
              if (gm && typeof gm.getDiskCount === 'function') {
                const count = gm.getDiskCount();
                const current = typeof gm.getCurrentDisk === 'function' ? gm.getCurrentDisk() : 0;
                if (count > 1) {
                  window.parent.postMessage({
                    type: 'guardian_disks_info',
                    diskCount: count,
                    currentDisk: current
                  }, '*');
                  console.log(`[PUAE] Multi-disk detected: ${count} disks loaded (active: ${current + 1})`);
                }
              }
            } catch(e) {}
          }, 1000);
        });
      }
    };

    // Watch #game for loading text updates, errors, and actual emulation start
    const gameElem = document.getElementById('game');
    const observer = new MutationObserver(() => {
      const loadingText = gameElem.querySelector('.ejs_loading_text');
      const errorText = gameElem.querySelector('.ejs_error_text');

      if (errorText && statusEl) {
        statusEl.textContent = errorText.textContent || 'Failed to initialize emulator core.';
        statusEl.style.color = '#f87171';
      } else if (loadingText && statusEl) {
        statusEl.textContent = loadingText.textContent;
      }

      if (window.EJS_emulator && window.EJS_emulator.started) {
        dismissOverlay();
      }
    });
    observer.observe(gameElem, { childList: true, subtree: true, characterData: true });

    // Failsafe timer check: dismiss overlay as soon as emulator started or rendering frames
    const canvasCheck = setInterval(() => {
      if ((window.EJS_emulator && window.EJS_emulator.started) || (window.puae_frames && window.puae_frames > 45)) {
        clearInterval(canvasCheck);
        dismissOverlay();
      }
    }, 250);

    // Unconditional failsafe to prevent permanent frozen overlay if start event is missed
    setTimeout(() => {
      dismissOverlay();

      window.addEventListener('keydown', (e) => {
        const canvas = document.querySelector('canvas');
        if (canvas && document.activeElement !== canvas && e.target !== canvas) {
          const tag = (e.target && e.target.tagName || '').toLowerCase();
          if (tag !== 'input' && tag !== 'textarea') {
            try { canvas.focus(); } catch(err) {}
          }
        }
      });
      const kbInterval = setInterval(ensureDirectKeyboard, 1000);
      setTimeout(() => clearInterval(kbInterval), 15000);
    });

    // Load EmulatorJS engine
    const script = document.createElement('script');
    script.src = '/emulatorjs/loader.js';
    script.onload = () => {
      console.log('[PUAE] EmulatorJS loader initialized');
    };
    script.onerror = (e) => {
      console.error('[PUAE] Failed to load EmulatorJS loader:', e);
      if (statusEl) statusEl.textContent = 'Error loading PUAE core components.';
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
